# Merge these entries into the MPPI controller namespace.
# The numeric defaults are simulation starting points, not vehicle-certified comfort limits.
controller_server:
  ros__parameters:
    FollowPath:
      # Append ChauffeurCritic to your existing critics list.
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        - ChauffeurCritic

      ChauffeurCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0

        longitudinal_jerk_weight: 1.0
        lateral_accel_weight: 0.35
        lateral_jerk_weight: 1.0
        steering_effort_weight: 0.10
        steering_rate_weight: 0.80
        steering_accel_weight: 0.35

        # Deadbands: no cost below these values.
        longitudinal_jerk_deadband: 0.75   # m/s^3
        lateral_accel_deadband: 1.50       # m/s^2
        lateral_jerk_deadband: 1.00        # m/s^3

        # Steering is normalized by the Ackermann min_turning_r:
        # 1.0 ~= full-lock curvature allowed by the MPPI motion model.
        steering_effort_deadband: 0.75
        steering_rate_deadband: 0.80       # full-lock fractions / s
        steering_accel_deadband: 2.00      # full-lock fractions / s^2
        min_steering_speed: 0.25           # m/s
        max_normalized_steering: 1.50

        apply_steering_terms_to_non_ackermann: false
